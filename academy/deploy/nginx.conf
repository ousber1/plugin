# Example Nginx server block (PHP-FPM). Adjust paths, domain and PHP version.
server {
    listen 80;
    server_name academy.example.ma;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name academy.example.ma;
    root /var/www/academy/public;          # document root MUST be /public
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/academy.example.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.example.ma/privkey.pem;

    # Each video upload chunk is VIDEO_CHUNK_MB (default 5 MB); keep a margin.
    client_max_body_size 64M;
    client_body_timeout 120s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(css|js|woff2|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
