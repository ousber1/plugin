# Example Apache virtual host. Requires mod_rewrite and PHP 8.3 (php-fpm or mod_php).
<VirtualHost *:443>
    ServerName academy.example.ma
    DocumentRoot /var/www/academy/public

    <Directory /var/www/academy/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Each video chunk is VIDEO_CHUNK_MB (default 5 MB)
    LimitRequestBody 67108864

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/academy.example.ma/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/academy.example.ma/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/academy-error.log
    CustomLog ${APACHE_LOG_DIR}/academy-access.log combined
</VirtualHost>
